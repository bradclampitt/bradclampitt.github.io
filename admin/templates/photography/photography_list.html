{% extends "_base.html" %}

{% block title %}Photography - Admin Console{% endblock %}
{% block header_title %}Photography{% endblock %}

{% block content %}
<div class="space-y-8" x-data='photographyTable({ photos: {{ photos | tojson | safe }} })' x-init="init()">
    <section class="glass-panel p-6 space-y-6">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
            <div>
                <h2 class="text-3xl font-semibold text-slate-900">Photography</h2>
                <p class="text-sm text-slate-500 mt-1">Manage your photography entries</p>
            </div>
            <a href="/admin/photography/new" class="inline-flex items-center justify-center bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                <i class="fas fa-plus mr-2"></i>New Photo
            </a>
        </div>

        <!-- Filters and Sorting -->
        <div class="flex flex-col gap-4 sm:flex-row sm:items-end border-b border-slate-200 pb-4">
            <!-- Search Input -->
            <div class="flex-1">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Search Photos</label>
                <input type="text" 
                       placeholder="Type to search by name, category, location, or year..."
                       class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 focus:border-blue-500 focus:ring-blue-500"
                       x-model="searchQuery"
                       @input="currentPage = 1">
            </div>
            
            <!-- Sort by -->
            <div class="flex-1 sm:flex-initial sm:min-w-[200px]">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Sort by</label>
                <select class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 focus:border-blue-500 focus:ring-blue-500" x-model="sortBy">
                    <option value="photo_name">Photo Name</option>
                    <option value="year">Year</option>
                    <option value="category">Category</option>
                    <option value="location">Location</option>
                </select>
            </div>
        </div>

        <!-- Responsive Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4">
            <template x-for="photo in filteredAndPaginatedPhotos()" :key="photo.id">
                <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
                    <!-- Image -->
                    <div class="aspect-video bg-slate-100 overflow-hidden cursor-pointer" @click="openImageModal(photo)" x-show="photo.image_url">
                        <img :src="photo.image_url" :alt="photo.photo_name" class="w-full h-full object-cover hover:opacity-90 transition-opacity">
                    </div>
                    <template x-if="!photo.image_url">
                        <div class="aspect-video bg-slate-100 flex items-center justify-center text-slate-400">
                            <i class="fas fa-image text-4xl"></i>
                        </div>
                    </template>
                    
                    <!-- Content -->
                    <div class="p-4">
                        <h3 class="font-semibold text-slate-900 text-sm mb-1 line-clamp-2" x-text="photo.photo_name"></h3>
                        <template x-if="photo.category_label">
                            <div class="mb-2">
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium" 
                                      :class="{
                                          'bg-blue-100 text-blue-800': photo.category_color === 'blue',
                                          'bg-red-100 text-red-800': photo.category_color === 'red',
                                          'bg-green-100 text-green-800': photo.category_color === 'green',
                                          'bg-yellow-100 text-yellow-800': photo.category_color === 'yellow',
                                          'bg-purple-100 text-purple-800': photo.category_color === 'purple',
                                          'bg-gray-100 text-gray-800': !['blue', 'red', 'green', 'yellow', 'purple'].includes(photo.category_color)
                                      }"
                                      x-text="photo.category_label"></span>
                            </div>
                        </template>
                        
                        <!-- Details (hidden on smallest screens) -->
                        <div class="space-y-1 text-xs text-slate-500 hidden sm:block">
                            <template x-if="photo.location">
                                <div class="flex items-center">
                                    <i class="fas fa-map-marker-alt mr-1 w-3"></i>
                                    <span class="truncate" x-text="photo.location"></span>
                                </div>
                            </template>
                            <template x-if="photo.year">
                                <div class="flex items-center">
                                    <i class="fas fa-calendar mr-1 w-3"></i>
                                    <span x-text="photo.year"></span>
                                </div>
                            </template>
                        </div>
                        
                        <!-- Actions -->
                        <div class="mt-3 pt-3 border-t border-slate-100 flex gap-2">
                            <a :href="'/admin/photography/' + photo.id" class="inline-flex items-center justify-center rounded-lg border border-blue-600 bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-700 transition">
                                Edit
                            </a>
                            <form method="POST" action="/admin/photography/delete" class="inline" onsubmit="return confirm('Are you sure you want to delete this photo?');">
                                <input type="hidden" name="photo_id" :value="photo.id">
                                <button type="submit" class="inline-flex items-center justify-center rounded-lg border border-red-600 bg-red-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-red-700 transition">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Empty State -->
        <div x-show="!filteredAndPaginatedPhotos().length" class="text-center py-12">
            <i class="fas fa-images text-4xl text-slate-300 mb-4"></i>
            <p class="text-slate-500" x-text="searchQuery && searchQuery.trim() ? 'No photos match your search.' : 'No photos yet.'"></p>
        </div>

        <!-- Pagination -->
        <div class="flex flex-col gap-3 border-t border-slate-100 pt-4 sm:flex-row sm:items-center sm:justify-between">
            <!-- Left: Per Page Dropdown -->
            <div class="flex items-center gap-2 text-sm text-slate-500">
                <span>Per page</span>
                <select class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-600 focus:border-blue-500 focus:ring-blue-500" style="padding-right: 2rem" x-model.number="perPage">
                    <template x-for="size in perPageOptions" :key="'photo-size-' + size">
                        <option :value="size" x-text="size"></option>
                    </template>
                </select>
            </div>
            
            <!-- Middle: Showing count -->
            <p class="text-sm text-slate-500 text-center" x-text="rangeSummary()"></p>
            
            <!-- Right: Page navigation -->
            <div class="flex items-center gap-2">
                <button type="button" class="rounded-lg border border-slate-200 px-3 py-1 text-xs font-semibold text-slate-600 hover:bg-slate-100 disabled:opacity-40" @click="prevPage" :disabled="currentPage === 1">Prev</button>
                <template x-for="page in pageNumbers()" :key="'photo-page-' + page">
                    <button type="button" class="rounded-lg border px-3 py-1 text-xs font-semibold" 
                            :class="page === currentPage ? 'border-blue-200 bg-blue-50 text-blue-700' : 'border-slate-200 text-slate-600 hover:bg-slate-100'" 
                            @click="goToPage(page)" 
                            x-text="page"></button>
                </template>
                <button type="button" class="rounded-lg border border-slate-200 px-3 py-1 text-xs font-semibold text-slate-600 hover:bg-slate-100 disabled:opacity-40" @click="nextPage" :disabled="currentPage === totalPages()">Next</button>
            </div>
        </div>
    </section>
    
    <!-- Image Modal -->
    <div x-show="showImageModal" 
         x-cloak
         @click.away="closeImageModal()"
         @keydown.escape.window="closeImageModal()"
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-75 p-4"
         style="display: none;">
        <div class="relative w-[80vw] h-[80vh] bg-white rounded-lg shadow-2xl overflow-hidden flex flex-col">
            <!-- Header with close button -->
            <div class="flex items-center justify-between p-4 border-b border-slate-200 bg-white">
                <div class="flex-1 min-w-0">
                    <h3 class="text-lg font-semibold text-slate-900 truncate" x-text="modalPhoto?.photo_name || 'Photo'"></h3>
                    <template x-if="modalPhoto?.category_label">
                        <p class="text-sm text-slate-500" x-text="modalPhoto.category_label"></p>
                    </template>
                </div>
                <button @click="closeImageModal()" 
                        class="ml-4 text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fas fa-times text-2xl"></i>
                </button>
            </div>
            
            <!-- Image Container -->
            <div class="flex-1 overflow-auto bg-slate-50 flex items-center justify-center p-4">
                <template x-if="modalPhoto?.image_url">
                    <img :src="modalPhoto.image_url" 
                         :alt="modalPhoto.photo_name" 
                         class="max-w-full max-h-full object-contain">
                </template>
            </div>
            
            <!-- Footer with photo details -->
            <template x-if="modalPhoto">
                <div class="p-4 border-t border-slate-200 bg-white">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                        <template x-if="modalPhoto.location">
                            <div>
                                <p class="text-slate-500 text-xs mb-1">Location</p>
                                <p class="font-medium text-slate-900" x-text="modalPhoto.location"></p>
                            </div>
                        </template>
                        <template x-if="modalPhoto.year">
                            <div>
                                <p class="text-slate-500 text-xs mb-1">Year</p>
                                <p class="font-medium text-slate-900" x-text="modalPhoto.year"></p>
                            </div>
                        </template>
                        <template x-if="modalPhoto.category_label">
                            <div>
                                <p class="text-slate-500 text-xs mb-1">Category</p>
                                <p class="font-medium text-slate-900" x-text="modalPhoto.category_label"></p>
                            </div>
                        </template>
                        <div class="flex items-end gap-2">
                            <a :href="'/admin/photography/' + modalPhoto.id" 
                               class="inline-flex items-center justify-center rounded-lg border border-blue-600 bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-700 transition">
                                <i class="fas fa-edit mr-1"></i>Edit
                            </a>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function photographyTable(initial) {
    return {
        perPageOptions: [12, 24, 36, 48, 60],
        perPage: 24,
        currentPage: 1,
        photos: initial.photos || [],
        searchQuery: '',
        sortBy: 'photo_name',
        showImageModal: false,
        modalPhoto: null,
        init() {
            this.$watch('perPage', () => { this.currentPage = 1; });
            this.$watch('searchQuery', () => { this.currentPage = 1; });
            this.$watch('sortBy', () => { this.currentPage = 1; });
        },
        filteredPhotos() {
            let filtered = [...this.photos];
            
            // Apply search query filter
            if (this.searchQuery && this.searchQuery.trim()) {
                const query = this.searchQuery.trim().toLowerCase();
                filtered = filtered.filter(photo => 
                    (photo.photo_name || '').toLowerCase().includes(query) ||
                    (photo.category_label || '').toLowerCase().includes(query) ||
                    (photo.location || '').toLowerCase().includes(query) ||
                    (photo.year || '').toString().includes(query)
                );
            }
            
            // Apply sorting
            filtered.sort((a, b) => {
                let aVal, bVal;
                
                switch(this.sortBy) {
                    case 'year':
                        aVal = (a.year || '').toString();
                        bVal = (b.year || '').toString();
                        return bVal.localeCompare(aVal); // Descending (newest first)
                    case 'category':
                        aVal = (a.category_label || '').toLowerCase();
                        bVal = (b.category_label || '').toLowerCase();
                        break;
                    case 'location':
                        aVal = (a.location || '').toLowerCase();
                        bVal = (b.location || '').toLowerCase();
                        break;
                    case 'photo_name':
                    default:
                        aVal = (a.photo_name || '').toLowerCase();
                        bVal = (b.photo_name || '').toLowerCase();
                        break;
                }
                
                if (aVal < bVal) return -1;
                if (aVal > bVal) return 1;
                return 0;
            });
            
            return filtered;
        },
        totalPages() {
            const total = this.filteredPhotos().length;
            return Math.max(1, Math.ceil(total / this.perPage));
        },
        filteredAndPaginatedPhotos() {
            const filtered = this.filteredPhotos();
            const start = (this.currentPage - 1) * this.perPage;
            return filtered.slice(start, start + this.perPage);
        },
        goToPage(page) {
            const total = this.totalPages();
            this.currentPage = Math.min(Math.max(page, 1), total);
        },
        prevPage() {
            this.goToPage(this.currentPage - 1);
        },
        nextPage() {
            this.goToPage(this.currentPage + 1);
        },
        pageNumbers() {
            const total = this.totalPages();
            if (total === 0) return [];
            if (total === 1) return [1];
            
            const current = this.currentPage;
            const pages = [];
            
            const start = Math.max(1, current - 1);
            const end = Math.min(total, current + 1);
            
            for (let i = start; i <= end; i++) {
                pages.push(i);
            }
            
            return pages;
        },
        rangeSummary() {
            const filtered = this.filteredPhotos();
            if (!filtered.length) {
                return 'Showing 0 items';
            }
            const start = (this.currentPage - 1) * this.perPage + 1;
            const end = Math.min(start + this.perPage - 1, filtered.length);
            return `Showing ${start}-${end} of ${filtered.length} items`;
        },
        openImageModal(photo) {
            if (photo && photo.image_url) {
                this.modalPhoto = photo;
                this.showImageModal = true;
                // Prevent body scroll when modal is open
                document.body.style.overflow = 'hidden';
            }
        },
        closeImageModal() {
            this.showImageModal = false;
            this.modalPhoto = null;
            // Restore body scroll
            document.body.style.overflow = '';
        },
    };
}
</script>
{% endblock %}
