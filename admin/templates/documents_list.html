{% extends "_base.html" %}

{% block title %}Documents - Admin Console{% endblock %}
{% block header_title %}Documents{% endblock %}

{% block content %}
<div class="space-y-8" x-data='documentsTable({ documents: {{ documents | tojson | safe }} })' x-init="init()">
    <section class="glass-panel p-6 space-y-6">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
            <div>
                <h2 class="text-3xl font-semibold text-slate-900">Documents</h2>
                <p class="text-sm text-slate-500 mt-1">Manage your documents</p>
            </div>
            <a href="/admin/documents/new" class="inline-flex items-center justify-center bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                <i class="fas fa-plus mr-2"></i>New Document
            </a>
        </div>

        <div class="overflow-x-auto -mx-6 px-6">
            <table class="w-full divide-y divide-slate-200 text-sm">
                <thead class="bg-slate-50 text-xs uppercase tracking-widest text-slate-400">
                    <tr>
                        <th class="px-3 py-3 text-left sm:px-4 sm:py-3">Title</th>
                        <th class="px-3 py-3 text-left hidden md:table-cell sm:px-4 sm:py-3">Category</th>
                        <th class="px-3 py-3 text-left hidden lg:table-cell sm:px-4 sm:py-3">Type</th>
                        <th class="px-3 py-3 text-left hidden lg:table-cell sm:px-4 sm:py-3">Tabs</th>
                        <th class="px-3 py-3 text-left hidden lg:table-cell sm:px-4 sm:py-3">Status</th>
                        <th class="px-3 py-3 text-left hidden xl:table-cell sm:px-4 sm:py-3">Updated</th>
                        <th class="px-3 py-3 text-left sm:px-4 sm:py-3">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 bg-white" x-show="paginatedDocuments().length">
                    <template x-for="doc in paginatedDocuments()" :key="doc.id">
                        <tr class="hover:bg-slate-50">
                            <td class="px-3 py-4 sm:px-4">
                                <div class="text-sm font-medium text-slate-900" x-text="doc.title"></div>
                                <template x-if="doc.summary">
                                    <div class="text-xs text-slate-500 mt-1 md:hidden" x-text="(doc.summary || '').substring(0, 50) + ((doc.summary || '').length > 50 ? '...' : '')"></div>
                                </template>
                                <template x-if="doc.category_label">
                                    <div class="text-xs text-slate-500 mt-1 md:hidden" x-text="doc.category_label"></div>
                                </template>
                            </td>
                            <td class="px-3 py-4 whitespace-nowrap text-sm text-slate-500 hidden md:table-cell sm:px-4">
                                <span x-text="doc.category_label || '-'"></span>
                            </td>
                            <td class="px-3 py-4 whitespace-nowrap text-sm text-slate-500 hidden lg:table-cell sm:px-4">
                                <span x-text="doc.type_label || '-'"></span>
                            </td>
                            <td class="px-3 py-4 whitespace-nowrap hidden lg:table-cell sm:px-4">
                                <template x-if="doc.tab_codes">
                                    <div class="flex flex-wrap gap-1">
                                        <template x-for="code in (doc.tab_codes || '').split(',')" :key="code">
                                            <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800" x-text="code"></span>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="!doc.tab_codes">
                                    <span class="text-sm text-slate-400">-</span>
                                </template>
                            </td>
                            <td class="px-3 py-4 whitespace-nowrap text-sm hidden lg:table-cell sm:px-4">
                                <template x-if="doc.status === 'Published' || !doc.status">
                                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                        <i class="fas fa-check-circle mr-1"></i>Published
                                    </span>
                                </template>
                                <template x-if="doc.status === 'Draft'">
                                    <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-800">
                                        <i class="fas fa-edit mr-1"></i>Draft
                                    </span>
                                </template>
                            </td>
                            <td class="px-3 py-4 whitespace-nowrap text-sm text-slate-500 hidden xl:table-cell sm:px-4">
                                <span x-text="doc.updated_at || '-'"></span>
                            </td>
                            <td class="px-3 py-4 whitespace-nowrap text-sm font-medium sm:px-4">
                                <div class="flex flex-col gap-1 sm:flex-row sm:gap-2">
                                    <a :href="'/admin/documents/' + doc.id" class="inline-flex items-center justify-center rounded-lg border border-blue-600 bg-blue-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-blue-700 transition">Edit</a>
                                    <form method="POST" action="/admin/documents/delete" class="inline" onsubmit="return confirm('Are you sure you want to delete this document?');">
                                        <input type="hidden" name="doc_id" :value="doc.id">
                                        <button type="submit" class="inline-flex items-center justify-center rounded-lg border border-red-600 bg-red-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-red-700 transition">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
                <tbody x-show="!paginatedDocuments().length">
                    <tr>
                        <td colspan="7" class="px-6 py-6 text-center text-slate-500">No documents yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="flex flex-col gap-3 border-t border-slate-100 pt-4 sm:flex-row sm:items-center sm:justify-between">
            <!-- Left: Per Page Dropdown -->
            <div class="flex items-center gap-2 text-sm text-slate-500">
                <span>Per page</span>
                <select class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-semibold text-slate-600 focus:border-blue-500 focus:ring-blue-500" style="padding-right: 2rem" x-model.number="perPage">
                    <template x-for="size in perPageOptions" :key="'doc-size-' + size">
                        <option :value="size" x-text="size"></option>
                    </template>
                </select>
            </div>
            
            <!-- Middle: Showing count -->
            <p class="text-sm text-slate-500 text-center" x-text="rangeSummary()"></p>
            
            <!-- Right: Page navigation -->
            <div class="flex items-center gap-2">
                <button type="button" class="rounded-lg border border-slate-200 px-3 py-1 text-xs font-semibold text-slate-600 hover:bg-slate-100 disabled:opacity-40" @click="prevPage" :disabled="currentPage === 1">Prev</button>
                <template x-for="page in pageNumbers()" :key="'doc-page-' + page">
                    <button type="button" class="rounded-lg border px-3 py-1 text-xs font-semibold" 
                            :class="page === currentPage ? 'border-blue-200 bg-blue-50 text-blue-700' : 'border-slate-200 text-slate-600 hover:bg-slate-100'" 
                            @click="goToPage(page)" 
                            x-text="page"></button>
                </template>
                <button type="button" class="rounded-lg border border-slate-200 px-3 py-1 text-xs font-semibold text-slate-600 hover:bg-slate-100 disabled:opacity-40" @click="nextPage" :disabled="currentPage === totalPages()">Next</button>
            </div>
        </div>
    </section>
</div>

<script>
function documentsTable(initial) {
    return {
        perPageOptions: [10, 20, 30, 50, 100],
        perPage: 10,
        currentPage: 1,
        documents: initial.documents || [],
        init() {
            this.$watch('perPage', () => { this.currentPage = 1; });
        },
        totalPages() {
            const total = this.documents.length;
            return Math.max(1, Math.ceil(total / this.perPage));
        },
        paginatedDocuments() {
            const start = (this.currentPage - 1) * this.perPage;
            return this.documents.slice(start, start + this.perPage);
        },
        goToPage(page) {
            const total = this.totalPages();
            this.currentPage = Math.min(Math.max(page, 1), total);
        },
        prevPage() {
            this.goToPage(this.currentPage - 1);
        },
        nextPage() {
            this.goToPage(this.currentPage + 1);
        },
        pageNumbers() {
            const total = this.totalPages();
            if (total === 0) return [];
            if (total === 1) return [1];
            
            const current = this.currentPage;
            const pages = [];
            
            // Show current page and 1 page on each side
            const start = Math.max(1, current - 1);
            const end = Math.min(total, current + 1);
            
            for (let i = start; i <= end; i++) {
                pages.push(i);
            }
            
            return pages;
        },
        rangeSummary() {
            if (!this.documents.length) {
                return 'Showing 0 items';
            }
            const start = (this.currentPage - 1) * this.perPage + 1;
            const end = Math.min(start + this.perPage - 1, this.documents.length);
            return `Showing ${start}-${end} of ${this.documents.length} items`;
        },
    };
}
</script>
{% endblock %}
