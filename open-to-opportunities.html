    ],
    async init() {
        await this.loadSiteSettings();
        await this.loadCMSBlocks();
    },
    async loadSiteSettings() {
        try {
            if (window.isStaticSite && window.isStaticSite()) {
                const db = await window.getIndexDb();
                const stmt = db.prepare('SELECT setting_key, setting_value, setting_type FROM cms_site_settings ORDER BY setting_key');
                const settings = {};
                while (stmt.step()) {
                    const row = stmt.getAsObject();
                    let val = row.setting_value;
                    if (row.setting_type === 'json') { try { val = JSON.parse(val); } catch (e) {} }
                    settings[row.setting_key] = val;
                }
                stmt.free();
                this.siteSettings = settings;
            } else {
                const host = window.location.hostname || '';
                const isLocalHost = host === 'localhost' || host === '127.0.0.1';
                const isDevDomain = host.includes('projectmanager.test') || host.includes('.local') || host === 'githubv2.projectmanager.test';
                const isPrivateNetwork = /^192\.168\./.test(host) || /^10\./.test(host) || /^172\.(1[6-9]|2\d|3[0-1])\./.test(host);
                const apiUrl = (isLocalHost || isDevDomain || isPrivateNetwork) ? 'http://127.0.0.1:8000/api/cms/settings' : '/api/cms/settings';
                const response = await fetch(apiUrl);
                if (response.ok) { const data = await response.json(); this.siteSettings = data.settings || {}; }
            }
        } catch (error) {
            console.error('Error loading site settings:', error);
        } finally {
            this.loadingSettings = false;
        }
    },
    async loadCMSBlocks() {
        try {
            if (window.isStaticSite && window.isStaticSite()) {
                const db = await window.getIndexDb();
                const stmt = db.prepare('SELECT block_id, title, content, content_format, description, image, image_position, image_description, gallery_images FROM cms_blocks WHERE is_active = 1 ORDER BY sort_order, title');
                const blocks = {};
                while (stmt.step()) {
                    const row = stmt.getAsObject();
                    let gallery = [];
                    if (row.gallery_images) { try { gallery = JSON.parse(row.gallery_images); if (!Array.isArray(gallery)) gallery = []; } catch (e) {} }
                    blocks[row.block_id] = { block_id: row.block_id, title: row.title, content: row.content, content_format: row.content_format || 'html', description: row.description || '', image: row.image || '', image_position: row.image_position || 'right', image_description: row.image_description || '', gallery_images: gallery };
                }
                stmt.free();
                this.cmsBlocks = blocks;
            } else {
                const host = window.location.hostname || '';
                const isLocalHost = host === 'localhost' || host === '127.0.0.1';
                const isDevDomain = host.includes('projectmanager.test') || host.includes('.local') || host === 'githubv2.projectmanager.test';
                const isPrivateNetwork = /^192\.168\./.test(host) || /^10\./.test(host) || /^172\.(1[6-9]|2\d|3[0-1])\./.test(host);
                const apiUrl = (isLocalHost || isDevDomain || isPrivateNetwork) ? 'http://127.0.0.1:8000/api/cms/blocks' : '/api/cms/blocks';
                const response = await fetch(apiUrl);
                if (response.ok) {
                    const data = await response.json();
                    this.cmsBlocks = data.blocks || {};
                }
            }
        } catch (error) {
            console.error('Error loading CMS blocks:', error);
        } finally {
            this.loadingBlocks = false;
        }
    }
