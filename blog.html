    siteSettings: {},
    loadingSettings: true,
    async init() {
        await this.loadSiteSettings();
    },
    async loadSiteSettings() {
        try {
            const host = window.location.hostname || '';
            const isLocalHost = host === 'localhost' || host === '127.0.0.1';
            const isDevDomain = host.includes('projectmanager.test') || host.includes('.local') || host === 'githubv2.projectmanager.test';
            const isPrivateNetwork = /^192\.168\./.test(host) || /^10\./.test(host) || /^172\.(1[6-9]|2\d|3[0-1])\./.test(host);

            const apiUrl = (isLocalHost || isDevDomain || isPrivateNetwork)
                ? 'http://127.0.0.1:8000/api/cms/settings'
                : '/api/cms/settings';

            const response = await fetch(apiUrl);
            if (response.ok) {
                const data = await response.json();
                this.siteSettings = data.settings || {};
            }
        } catch (error) {
            console.error('Error loading site settings:', error);
        } finally {
            this.loadingSettings = false;
        }
    }
}">

                                <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between py-3 border-b border-gray-200 last:border-b-0 gap-2 lg:gap-0">
                                    <div class="flex-1">
                                        <h4 class="font-medium text-sm lg:text-base">
                                            <a :href="'blog/posts/' + post.slug + '.html'" class="hover:text-blue-600 transition-colors" x-text="post.title">
                                            </a>
                                        </h4>
                                        <p class="text-xs lg:text-sm text-gray-600" x-text="post.excerpt.substring(0, 80) + '...'"></p>
                                    </div>
                                    <div class="text-left lg:text-right flex-shrink-0">
                                        <time class="text-gray-500 text-xs lg:text-sm" x-text="formatDate(post.date)"></time>
                                        <div class="mt-1">
                                            <span class="px-2 py-1 rounded text-xs"
                                                :class="getCategoryColor(post.category)"
                                                x-text="post.category.charAt(0).toUpperCase() + post.category.slice(1)"></span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function blogApp() {
        return {
            posts: [],
            filteredPosts: [],
            categories: [],
            categoryFilters: ['all'],
            activeCategory: 'all',
            searchQuery: '',
            loading: true,

            async init() {
                await this.loadPosts();
                this.filterPosts();
                this.loading = false;
            },

            async loadPosts() {
                try {
                    const host = window.location.hostname || '';
                    const isLocalHost = host === 'localhost' || host === '127.0.0.1';
                    const isDevDomain = host.includes('projectmanager.test') || host.includes('.local') || host === 'githubv2.projectmanager.test';
                    const isPrivateNetwork = /^192\.168\./.test(host) || /^10\./.test(host) || /^172\.(1[6-9]|2\d|3[0-1])\./.test(host);

                    const apiUrl = (isLocalHost || isDevDomain || isPrivateNetwork)
                        ? 'http://127.0.0.1:8000/api/blog/posts'
                        : '/api/blog/posts';

                    const response = await fetch(apiUrl);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    this.posts = data.posts || [];
                    const categoryValues = this.posts
                        .map(post => (post.category || '').toString().toLowerCase().trim())
                        .filter(Boolean);
                    this.categories = Array.from(new Set(categoryValues)).sort();
                    this.categoryFilters = ['all', ...this.categories];
                    if (this.activeCategory !== 'all' && !this.categories.includes(this.activeCategory)) {
                        this.activeCategory = 'all';
                    }
                    this.filteredPosts = [...this.posts];
                } catch (error) {
                    console.error('Error loading posts:', error);
                    this.posts = [];
                    this.filteredPosts = [];
                }
            },

            setActiveCategory(category) {
                this.activeCategory = category;
                this.filterPosts();
            },

            filterPosts() {
                let filtered = [...this.posts];

                // Filter by category
                if (this.activeCategory !== 'all') {
                    filtered = filtered.filter(post => post.category === this.activeCategory);
                }

                // Filter by search query
                if (this.searchQuery.trim()) {
                    const query = this.searchQuery.toLowerCase();
                    filtered = filtered.filter(post =>
                    post.title.toLowerCase().includes(query) ||
                    post.excerpt.toLowerCase().includes(query) ||
                    post.tags.some(tag => tag.toLowerCase().includes(query))
                    );
                }

                this.filteredPosts = filtered;
            },

            formatDate(dateString) {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                return new Date(dateString).toLocaleDateString('en-US', options);
            },

            getCategoryColor(category) {
                const colors = {
                    'magento': 'bg-purple-100 text-purple-800',
                    'devops': 'bg-green-100 text-green-800',
                    'tutorials': 'bg-orange-100 text-orange-800',
                    'tutorial': 'bg-orange-100 text-orange-800',
                    'aws': 'bg-blue-100 text-blue-800',
                    'security': 'bg-red-100 text-red-800',
                    'announcements': 'bg-indigo-100 text-indigo-800'
                };
                return colors[category] || 'bg-gray-100 text-gray-800';
            },

            getTagColor(tag) {
                const tagColors = {
                    'Magento 2': 'bg-purple-100 text-purple-800',
                    'AWS': 'bg-orange-100 text-orange-800',
                    'Docker': 'bg-blue-100 text-blue-800',
                    'DevOps': 'bg-green-100 text-green-800',
                    'PHP': 'bg-indigo-100 text-indigo-800',
                    'Development': 'bg-pink-100 text-pink-800',
                    'Prometheus': 'bg-red-100 text-red-800',
                    'Grafana': 'bg-yellow-100 text-yellow-800',
                    'Monitoring': 'bg-teal-100 text-teal-800',
                    'Performance': 'bg-emerald-100 text-emerald-800',
                    'Optimization': 'bg-lime-100 text-lime-800',
                    'CI/CD': 'bg-cyan-100 text-cyan-800',
                    'Automation': 'bg-violet-100 text-violet-800',
                    'API': 'bg-rose-100 text-rose-800',
                    'Integration': 'bg-amber-100 text-amber-800',
                    'Hyvä': 'bg-fuchsia-100 text-fuchsia-800',
                    'Frontend': 'bg-sky-100 text-sky-800',
                    'AlpineJS': 'bg-slate-100 text-slate-800',
                    'Security': 'bg-red-100 text-red-800',
                    'Linux': 'bg-stone-100 text-stone-800'
                };
                return tagColors[tag] || 'bg-gray-100 text-gray-800';
            },

            categoryLabel(category) {
                if (category === 'all') return 'All Posts';
                const labelMap = {
                    'aws': 'AWS',
                    'devops': 'DevOps',
                    'magento': 'Magento',
                    'tutorial': 'Tutorial',
                    'tutorials': 'Tutorials',
                    'security': 'Security',
                    'announcements': 'Announcements'
                };
                if (labelMap[category]) return labelMap[category];
                return category
                    .split(/[\s-_]+/)
                    .filter(Boolean)
                    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                    .join(' ');
                },

                getCategoryCount(category) {
                    if (category === 'all') {
                        return this.posts.length;
                    }
                    return this.posts.filter(post => post.category === category).length;
                },
                getCategoryBadgeClass(category) {
                    if (this.activeCategory !== category) return 'bg-gray-300';
                    const activeMap = {
                        'all': 'bg-blue-700',
                        'magento': 'bg-purple-700',
                        'devops': 'bg-green-700',
                        'tutorials': 'bg-orange-700',
                        'tutorial': 'bg-orange-700',
                        'aws': 'bg-blue-700',
                        'security': 'bg-red-700',
                        'announcements': 'bg-indigo-700'
                    };
                    return activeMap[category] || 'bg-gray-700';
                },
                filterButtonClass(category) {
                const inactive = 'bg-gray-200 text-gray-700 hover:bg-gray-300';
                if (this.activeCategory !== category) return inactive;
                const activeMap = {
                    'all': 'bg-blue-600 text-white',
                    'magento': 'bg-purple-600 text-white',
                    'devops': 'bg-green-600 text-white',
                    'tutorials': 'bg-orange-600 text-white',
                    'tutorial': 'bg-orange-600 text-white',
                    'aws': 'bg-blue-600 text-white',
                    'security': 'bg-red-600 text-white',
                    'announcements': 'bg-indigo-600 text-white'
                };
                return activeMap[category] || 'bg-gray-600 text-white';
            }
        }
    }
</script>
